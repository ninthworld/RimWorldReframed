name: Pure contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pure-tests:
    name: Pure contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Run game-independent checks
        shell: pwsh
        run: ./Tools/Test.ps1
